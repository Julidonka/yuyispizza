<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contáctanos - Yuyi's Pizza</title>

  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

  <!-- Adobe Fonts (Parkside y Baga) -->
  <link rel="stylesheet" href="https://use.typekit.net/hvc2oyw.css">

  <!-- Hoja de estilos personalizada -->
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body>

  <!-- HERO/CABEZOTE REDUCIDO PARA PÁGINAS INTERNAS -->
  <header class="hero-section hero-interno">
    <div class="overlay"></div>

    <!-- BARRA DE NAVEGACIÓN -->
    <nav class="navbar navbar-expand-lg navbar-dark custom-navbar">
      <div class="container">

        <!-- LOGO -->
        <a class="navbar-brand d-flex align-items-center" href="index.html">
          <img src="img/logo.svg" alt="Yuyi's Pizza Logo" class="logo-img me-2">
        </a>

        <!-- Botón Hamburguesa para Móviles -->
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuNavegacion" aria-controls="menuNavegacion" aria-expanded="false" aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>

        <!-- ENLACES DE MENÚ -->
        <div class="collapse navbar-collapse justify-content-end" id="menuNavegacion">
          <ul class="navbar-nav">
            <li class="nav-item">
              <a class="nav-link" href="index.html">Home</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="sobrenosotros.html">Sobre Nosotros</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="menu.html">Menú</a>
            </li>
            <li class="nav-item">
              <a class="nav-link active" href="contactanos.html">Contáctanos</a>
            </li>
          </ul>
        </div>

      </div>
    </nav>
  </header>

  <!-- SECCIÓN FORMULARIO DE CONTACTO -->
  <section class="py-5">
    <div class="container">
      
      <!-- Título de la sección -->
      <div class="row text-center mb-5">
        <div class="col-12">
          <h2 class="titulo-seccion">Contáctenos</h2>
          <div class="separador-hoja my-3">
            <img src="img/hoja.svg" alt="Decoración" class="img-hoja">
          </div>
        </div>
      </div>

      <!-- Bloque del Formulario + Imagen -->
      <div class="row g-0 rounded overflow-hidden shadow-sm align-items-stretch">
        
        <!-- Columna Izquierda: Formulario en Cuadro Verde -->
        <div class="col-lg-6 card-verde p-4 p-md-5 d-flex flex-column justify-content-center">
          <form action="#" method="POST" class="form-contacto">
            
            <div class="mb-4">
              <input type="text" class="form-control custom-input" placeholder="TU NOMBRE" required>
            </div>

            <div class="mb-4">
              <input type="email" class="form-control custom-input" placeholder="EMAIL" required>
            </div>

            <div class="mb-4">
              <input type="text" class="form-control custom-input" placeholder="ASUNTO" required>
            </div>

            <div class="mb-4">
              <textarea class="form-control custom-input" rows="3" placeholder="TU MENSAJE" required></textarea>
            </div>

            <div class="mt-4">
              <button type="submit" class="btn btn-enviar-contacto fw-bold">ENVIAR MENSAJE</button>
            </div>

          </form>
        </div>

        <!-- Columna Derecha: Imagen Contactanos -->
        <div class="col-lg-6">
          <img src="img/contactanos.jpeg" alt="Atención al cliente Yuyi's Pizza" class="img-fluid w-100 h-100 object-fit-cover">
        </div>

      </div>

    </div>
  </section>

  <!-- FOOTER / PIE DE PÁGINA -->
  <footer id="contactanos" class="footer-seccion py-5">
    <div class="container">
      <div class="row align-items-start text-center g-4">
        
        <!-- Columna 1: Contáctanos -->
        <div class="col-md-4 d-flex flex-column align-items-center">
          <h4 class="footer-titulo mb-3">Contáctanos</h4>
          <div class="footer-contenido">
            <p class="footer-texto mb-1">AK 15 # 170 - 65, Bogotá - Colombia</p>
            <p class="footer-texto mb-1">317 3871757</p>
            <p class="footer-texto mb-0">julidonka@gmail.com</p>
          </div>
        </div>

        <!-- Columna 2: Síganos -->
        <div class="col-md-4 d-flex flex-column align-items-center">
          <h4 class="footer-titulo mb-3">Síganos</h4>
          <div class="footer-contenido d-flex justify-content-center gap-3">
            <a href="https://facebook.com" target="_blank" rel="noopener noreferrer" class="redes-icon">
              <i class="bi bi-facebook"></i>
            </a>
            <a href="https://instagram.com" target="_blank" rel="noopener noreferrer" class="redes-icon">
              <i class="bi bi-instagram"></i>
            </a>
            <a href="https://youtube.com" target="_blank" rel="noopener noreferrer" class="redes-icon">
              <i class="bi bi-youtube"></i>
            </a>
          </div>
        </div>

        <!-- Columna 3: Horario -->
        <div class="col-md-4 d-flex flex-column align-items-center">
          <h4 class="footer-titulo mb-3">Horario</h4>
          <div class="footer-contenido">
            <p class="footer-texto mb-1">Lunes - domingo</p>
            <p class="footer-texto mb-0">11 a. m. - 10 p. m.</p>
          </div>
        </div>

      </div>
    </div>
  </footer>

 <!-- JS DE BOOTSTRAP (Justo antes de cerrar body) -->
  <script src="js/bootstrap.min.js"></script>
</body>
</html>
